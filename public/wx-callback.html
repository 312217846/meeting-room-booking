<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信登录 - 会议室预订系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: linear-gradient(135deg, #C9A96E 0%, #8B6914 50%, #5C4A1E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .callback-container {
            background: white;
            border-radius: 20px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 360px;
            width: 90%;
        }
        
        .loading-icon {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #07C160;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .success-icon {
            width: 60px;
            height: 60px;
            background: #07C160;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
            color: white;
        }
        
        .error-icon {
            width: 60px;
            height: 60px;
            background: #C0392B;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
            color: white;
        }
        
        h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 12px;
        }
        
        p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .error-details {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 12px;
            color: #999;
            word-break: break-all;
        }
        
        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 32px;
            background: #07C160;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div id="loadingState">
            <div class="loading-icon"></div>
            <h2>正在登录...</h2>
            <p>请稍候，正在处理微信授权</p>
        </div>
        
        <div id="successState" style="display: none;">
            <div class="success-icon">✓</div>
            <h2>登录成功</h2>
            <p>即将关闭窗口并返回主页面...</p>
        </div>
        
        <div id="errorState" style="display: none;">
            <div class="error-icon">✕</div>
            <h2>登录失败</h2>
            <p id="errorMessage">微信授权失败</p>
            <div id="errorDetails" class="error-details" style="display: none;"></div>
            <button class="btn" onclick="window.close()">关闭窗口</button>
        </div>
    </div>

    <script>
        // 获取URL参数
        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }
        
        // 发送消息给父窗口
        function notifyParent(type, data) {
            if (window.opener) {
                window.opener.postMessage({ type, ...data }, window.location.origin);
            }
        }
        
        // 处理微信回调
        async function handleWxCallback() {
            const code = getUrlParam('code');
            const state = getUrlParam('state');
            const error = getUrlParam('error');
            
            // 显示加载状态
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('successState').style.display = 'none';
            document.getElementById('errorState').style.display = 'none';
            
            // 用户取消授权
            if (error === 'access_denied') {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('errorMessage').textContent = '您取消了微信授权';
                notifyParent('wx_login_error', { message: '用户取消授权' });
                return;
            }
            
            // 缺少授权码
            if (!code) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('errorMessage').textContent = '授权码缺失，请重试';
                document.getElementById('errorDetails').style.display = 'block';
                document.getElementById('errorDetails').textContent = 'URL: ' + window.location.href;
                notifyParent('wx_login_error', { message: '缺少授权码' });
                return;
            }
            
            try {
                // 调用后端API完成登录
                const response = await fetch(`/api/auth/wx-callback?code=${code}`);
                const result = await response.json();
                
                if (result.code === 0) {
                    // 登录成功 - 存储用户信息并跳转
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('successState').style.display = 'block';
                    
                    localStorage.setItem('currentUser', JSON.stringify(result.data.user));
                    
                    // 1.5秒后跳转到主页
                    setTimeout(() => {
                        window.location.href = state || '/';
                    }, 1500);
                } else {
                    // 登录失败
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('errorState').style.display = 'block';
                    document.getElementById('errorMessage').textContent = result.message || '微信登录失败';
                    notifyParent('wx_login_error', { message: result.message });
                }
            } catch (error) {
                console.error('微信回调处理失败:', error);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('errorMessage').textContent = '网络错误，请重试';
                document.getElementById('errorDetails').style.display = 'block';
                document.getElementById('errorDetails').textContent = error.message;
                notifyParent('wx_login_error', { message: error.message });
            }
        }
        
        // 页面加载完成后处理
        document.addEventListener('DOMContentLoaded', handleWxCallback);
    </script>
</body>
</html>
